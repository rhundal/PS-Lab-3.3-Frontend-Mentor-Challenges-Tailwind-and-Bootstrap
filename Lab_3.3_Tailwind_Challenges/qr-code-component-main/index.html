<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | QR code component with Tailwind</title>

</head>

<body class="grid grid-rows-1 justify-center items-center min-h-100 mb-0 bg-[#D5E1EF]">
  <main class="flex flex-row justify-center items-center mt-25"> <!-- main container -->
    <section class="bg-white max-w-[320px] h-auto rounded-3xl"> <!-- outer container -->
      <section class="flex flex-row justify-center"> <!-- image area-->
        <img src="./images/image-qr-code.png" alt="qr code." class="rounded-4xl mt-5 mb-5 max-w-[90%] h-auto" />
      </section>
      <section class="text-[20px] font-bold text-center font-[Arial, Helvetica, sans-serif]">
        Improve your front-end <br />skills by building projects
        <!-- bolded_text -->
      </section>
      <section class="ml-[5px] text-[13px] text-center text-[hsl(216, 15%, 48%)] mb-[30px] mt-[15px]">
        <!-- unbolded_text -->
        <p class="text-center">
          Scan the QR code to visit Frontend Mentor <br /> and take your coding skills to <br /> the next level
        </p>
      </section>
    </section>
  </main>

  <footer class="flex flex-row justify-center mt-[30px] mb-[50px]">
    <p class="text-center"> Challenge by <a href=" https://www.frontendmentor.io?ref=challenge"
        class="text-blue-600 hover:underline">Frontend Mentor </a>
      <br /> Coded by <a href="#" class="text-blue-600 hover:underline">Rajdeep Hundal</a>
    </p>
  </footer>
</body>

</html>
