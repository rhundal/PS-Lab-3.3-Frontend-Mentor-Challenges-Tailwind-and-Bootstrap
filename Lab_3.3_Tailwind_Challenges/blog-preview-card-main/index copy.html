<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Blog preview card</title>
  <link rel="stylesheet" href="./styles/style.css" />

</head>

<body>
  <main class="mainContainer">

    <div class="outerContainer">
      <section class="topSection">
        <img src="./assets/images/illustration-article.svg" alt="article" class="img_style" />
      </section>
      <section class="middleSection">

        <div id="pillHeading">Learning </div>
        <div id="dateStyle">Published 21 Dec 2023 </div>
        <div id="headingSection"> HTML & CSS foundations</div>
        <div id="miniPara">
          These languages are the backbone of every website, defining structure, content, and presentation.
        </div>
      </section>
      <section class="bottomSection">
        <div id="leftColumn">
          <img src="./assets/images/image-avatar.webp" alt="profilepic" id="profilepicStyle" />
        </div>
        <div id="rightColumn">
          Greg Hooper
        </div>

      </section>
    </div>
  </main>





  <footer class="footerSection">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#"> Rajdeep Hundal</a>.
  </footer>
</body>

</html>
