<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Blog preview card with Tailwind</title>

</head>

<body class="bg-[hsl(47,88%,63%)] grid place-content-center place-items-center min-h-dvh">
  <main
    class="flex justify-center items-center w-[60%] md:w-[350px] border border-black rounded-3xl shadow-[10px_10px_3px_rgba(0,0,0,0.95)]">
    <section class="p-5 bg-white rounded-3xl grid-rows-3 place-content-center place-items-center">
      <section class="mb-5">
        <img src="./assets/images/illustration-article.svg" alt="article" class="rounded-3xl" />
      </section>
      <section class="mb-5"> <!-- middle section -->
        <div class="text-sm font-bold bg-[hsl(47,88%,63%)] w-max pr-2 pb-2 pl-2 pt-2 font-[Arial, Helvetica,
          sans-serif] rounded-sm mb-3">Learning </div>
        <div class="text-xs font-[Arial, Helvetica,
          sans-serif] mb-1">Published 21 Dec 2023 </div>
        <div class="text-sm md:text-lg font-bold mb-2"> HTML & CSS foundations</div>
        <div class="text-xs md:text-base text-[hsl(0,0%,42%)]">
          These languages are the backbone of every website, defining structure, content, and presentation.
        </div>
      </section>
      <section class="grid w-[160px] grid-cols-[60px_100px] -m-1">
        <div class="w-20">
          <img src="./assets/images/image-avatar.webp" alt="profilepic" class="max-w-[60%] md:max-w-full" />
        </div>
        <div class="ml-2 md:ml-5 w-40 mt-3 md:mt-5 font-bold">
          Greg Hooper
        </div>
      </section>
    </section>
  </main>
</body>

</html>
